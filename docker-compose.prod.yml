name: kovar-agent-admin

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kovar_gateway
      POSTGRES_USER: kovar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/production.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kovar -d kovar_gateway"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
    image: kovar-agent-gateway:local
    entrypoint: ["migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: postgres://kovar:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/production.env}@postgres:5432/kovar_gateway?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: kovar-agent-gateway:local
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://kovar:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/production.env}@postgres:5432/kovar_gateway?sslmode=disable
      KOVAR_BASE_URL: ${KOVAR_BASE_URL:-https://kovar.ai}
      KOVAR_MANAGE_BASE_URL: ${KOVAR_MANAGE_BASE_URL:-}
      KOVAR_MODEL_BASE_URL: ${KOVAR_MODEL_BASE_URL:-}
      KOVAR_HTTP_TIMEOUT: ${KOVAR_HTTP_TIMEOUT:-120s}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-130s}
      AGENT_NONCE_TTL: ${AGENT_NONCE_TTL:-5m}
      AGENT_SIGNATURE_MAX_CLOCK_SKEW: ${AGENT_SIGNATURE_MAX_CLOCK_SKEW:-5m}
      DEFAULT_PER_REQUEST_LIMIT: ${DEFAULT_PER_REQUEST_LIMIT:-10000}
      DEFAULT_DAILY_LIMIT: ${DEFAULT_DAILY_LIMIT:-100000}
      DEFAULT_MONTHLY_LIMIT: ${DEFAULT_MONTHLY_LIMIT:-1000000}
      GATEWAY_ADMIN_USERNAME: ${GATEWAY_ADMIN_USERNAME:?Set GATEWAY_ADMIN_USERNAME in deploy/production.env}
      GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD:?Set GATEWAY_ADMIN_PASSWORD in deploy/production.env}
      ADMIN_TOKEN_TTL: ${ADMIN_TOKEN_TTL:-8h}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in deploy/production.env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RATE_LIMIT: ${RATE_LIMIT:-120}
      RATE_LIMIT_IP: ${RATE_LIMIT_IP:-300}
      RATE_LIMIT_ADMIN_LOGIN: ${RATE_LIMIT_ADMIN_LOGIN:-10}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-8388608}
      ROUTER_CONFIG: configs/router.json
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  admin-web:
    build:
      context: ${KOVAR_ADMIN_WEBSIDE_CONTEXT:-../kovar-agent-admin-webside}
      dockerfile: Dockerfile
      args:
        ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    image: kovar-agent-admin-webside:local
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      GATEWAY_API_URL: http://gateway:8080
      GATEWAY_TIMEOUT_MS: ${GATEWAY_TIMEOUT_MS:-135000}
    ports:
      - "127.0.0.1:${ADMIN_WEB_HOST_PORT:-3000}:3000"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
