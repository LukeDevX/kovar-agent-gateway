services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kovar_gateway
      POSTGRES_USER: kovar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/dev-env.py first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kovar -d kovar_gateway"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  postgres_data:
